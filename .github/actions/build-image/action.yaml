name: Build Wishlist image
description: Share image inputs and persistent layer/compiler caching between validation and publication.
inputs:
  publish:
    description: Push the image only after the caller has passed the validation gate.
    default: 'false'
  cache-scope:
    description: Separate trusted main caches from each pull request's caches.
    required: true
  tags:
    description: Image tags generated by the image-validation job.
    required: true
  labels:
    description: Identical OCI labels for image validation and publication.
    required: true
outputs:
  digest:
    description: Published image digest.
    value: ${{ steps.image.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      id: builder
    # Key the compiler cache by toolchain, target/settings, dependencies and source
    # revision. Prefix restoration keeps compatible entries useful after edits.
    # Branch-scoped Actions caches and separate names prevent PR -> main reuse.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: go-cache
      if: inputs.publish != 'true'
      with:
        path: ${{ runner.temp }}/wishlist-go-build
        key: docker-go-v1-${{ runner.os }}-${{ runner.arch }}-linux-amd64-arm64-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum', '.github/actions/build-image/action.yaml') }}-${{ inputs.cache-scope }}-${{ github.sha }}
        restore-keys: |
          docker-go-v1-${{ runner.os }}-${{ runner.arch }}-linux-amd64-arm64-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum', '.github/actions/build-image/action.yaml') }}-${{ inputs.cache-scope }}-
          docker-go-v1-${{ runner.os }}-${{ runner.arch }}-linux-amd64-arm64-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum', '.github/actions/build-image/action.yaml') }}-main-
    # Post steps run in reverse: extract the mount before actions/cache saves it.
    - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      if: inputs.publish != 'true'
      with:
        builder: ${{ steps.builder.outputs.name }}
        utility-image: alpine:3.24.4
        cache-map: '{"${{ runner.temp }}/wishlist-go-build": "/root/.cache/go-build"}'
        scratch-dir: ${{ runner.temp }}/wishlist-cache-dance
        skip-extraction: ${{ steps.go-cache.outputs.cache-hit == 'true' }}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: image
      with:
        builder: ${{ steps.builder.outputs.name }}
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.publish }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: |
          type=gha,scope=wishlist-image-${{ inputs.cache-scope }}
          type=gha,scope=wishlist-image-main
        # A read-only/full cache must not turn a correct build into a failure.
        # Publication imports validation's layers and does not export them again.
        cache-to: ${{ inputs.publish == 'false' && format('type=gha,scope=wishlist-image-{0},mode=max,ignore-error=true', inputs.cache-scope) || '' }}
