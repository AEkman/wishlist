name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go and PostgreSQL ${{ matrix.postgres }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        postgres: ["18.7", "19.0"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: wishlist_test
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist -d wishlist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WISHLIST_TEST_DATABASE_URL: postgres://wishlist:wishlist@127.0.0.1:5432/wishlist_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test ./... -count=1
      - run: go vet ./...
      - name: Check release planning
        run: python3 scripts/release-test.py
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  image:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=wishlist-image-main
          cache-to: type=gha,scope=wishlist-image-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }},mode=max,ignore-error=true

  publish:
    name: Publish versioned release
    needs: [test, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover interrupted releases and select version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py prepare
      - name: Build and publish
        if: steps.release.outputs.digest == ''
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/aekman/wishlist:${{ steps.release.outputs.version }}
            ghcr.io/aekman/wishlist:${{ steps.release.outputs.image_version }}
            ghcr.io/aekman/wishlist:main
            ghcr.io/aekman/wishlist:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Wishlist
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=wishlist-image-main
      - name: Restore references after partial publication
        if: steps.release.outputs.digest != ''
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_VERSION: ${{ steps.release.outputs.image_version }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "ghcr.io/aekman/wishlist:$RELEASE_VERSION" \
            --tag "ghcr.io/aekman/wishlist:$IMAGE_VERSION" \
            --tag ghcr.io/aekman/wishlist:main \
            --tag "ghcr.io/aekman/wishlist:sha-$GITHUB_SHA" \
            "ghcr.io/aekman/wishlist@$IMAGE_DIGEST"
      - name: Create release and record exact image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_DIGEST: ${{ steps.release.outputs.digest || steps.image.outputs.digest }}
        run: |
          python3 scripts/release.py finalize
          echo "Released $RELEASE_VERSION: ghcr.io/aekman/wishlist@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
